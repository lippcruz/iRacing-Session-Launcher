name: Relatar um bug / Report a bug
description: Informe um problema. / Tell us about unexpected behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remova dados privados dos logs. / Remove private data from logs.
  - type: input
    id: version
    attributes:
      label: Versão do launcher / Launcher version
      placeholder: 0.4.0-beta.1
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Versão do Windows / Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado / Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: O que aconteceu / What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir / Steps to reproduce
      placeholder: Liste os passos. / List the steps in order.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Contexto adicional / Additional context
      description: Apps e mensagens relevantes. Não envie apps.json. / Relevant apps and messages. Do not send apps.json.
