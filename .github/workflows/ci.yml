name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run setup:runtime
      - run: npm audit --audit-level=low
      - run: npm test
      - run: npm run test:smoke
